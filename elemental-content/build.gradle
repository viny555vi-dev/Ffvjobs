plugins { id 'net.neoforged.moddev' }
base { archivesName = mod_id }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
dependencies {
    implementation project(':elemental-jobs-core')
    implementation project(':elemental-abilities')
}
neoForge {
    version = project.neo_version
    runs {
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        client { client() }
    }
    mods {
        ffv_reborn { sourceSet(sourceSets.main) }
    }
}
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    from project(':elemental-jobs-core').sourceSets.main.output
    from project(':elemental-abilities').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
