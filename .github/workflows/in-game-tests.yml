name: NeoForge in-game test VM
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  minecraft-26-3-neoforge-gametests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile all three modules
        run: gradle build --no-daemon --stacktrace
      - name: Launch real Minecraft 26.3 NeoForge GameTestServer
        run: gradle :elemental-content:runGameTestServer --no-daemon --stacktrace
      - name: Install software X server and Mesa renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y xserver-xorg-core xserver-xorg-video-dummy libgl1-mesa-dri libglx-mesa0 x11-utils
          cat > /tmp/ffv-xorg.conf <<'EOF'
          Section "Device"
            Identifier "FFVDummy"
            Driver "dummy"
            VideoRam 256000
          EndSection
          Section "Monitor"
            Identifier "FFVMonitor"
            HorizSync 30-70
            VertRefresh 50-75
            Modeline "1280x1024" 108.00 1280 1328 1440 1688 1024 1025 1028 1066
          EndSection
          Section "Screen"
            Identifier "FFVScreen"
            Device "FFVDummy"
            Monitor "FFVMonitor"
            DefaultDepth 24
            SubSection "Display"
              Depth 24
              Modes "1280x1024"
            EndSubSection
          EndSection
          EOF
          sudo Xorg :99 -noreset +extension GLX +extension RANDR -config /tmp/ffv-xorg.conf -logfile /tmp/ffv-xorg.log &
          for i in $(seq 1 30); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 1
          done
          DISPLAY=:99 xdpyinfo >/dev/null
      - name: Launch Minecraft client renderer and camera smoke test
        run: |
          set +e
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe timeout -k 5s 60s gradle :elemental-content:runClient --no-daemon --stacktrace 2>&1 | tee client-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            cat client-smoke.log
            exit "$status"
          fi
          if grep -q "Failed to create backend\|Exception" client-smoke.log; then
            cat client-smoke.log
            exit 1
          fi
          grep -q "Final Fantasy V Reborn 1.0.0" client-smoke.log
          grep -q "NeoForge mod loading, version 26.3.0.95" client-smoke.log
      - name: Assemble installable modpack
        run: |
          mkdir -p dist/overrides/mods
          cp elemental-content/build/libs/ffv_reborn-1.0.0.jar dist/overrides/mods/
          cp modpack/manifest.json dist/manifest.json
          cp modpack/README.md dist/README.md
          (cd dist && zip -qr ../Final-Fantasy-V-Reborn-modpack.zip .)
      - name: Upload installable modpack
        uses: actions/upload-artifact@v4
        with:
          name: Final-Fantasy-V-Reborn-modpack
          path: Final-Fantasy-V-Reborn-modpack.zip
          if-no-files-found: error
      - name: Preserve Minecraft logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-neoforge-gametest-logs
          path: |
            **/logs/**
            **/crash-reports/**
            client-smoke.log
          if-no-files-found: warn
