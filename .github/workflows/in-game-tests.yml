name: NeoForge in-game test VM
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  minecraft-26-3-neoforge-gametests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile all three modules
        run: gradle build --no-daemon --stacktrace
      - name: Launch real Minecraft 26.3 NeoForge GameTestServer
        run: gradle :elemental-content:runGameTestServer --no-daemon --stacktrace
      - name: Install headless Wayland and Mesa renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y weston xwayland libgl1-mesa-dri libegl1-mesa libwayland-egl1 mesa-vulkan-drivers
          mkdir -p /tmp/ffv-runtime
          chmod 700 /tmp/ffv-runtime
          XDG_RUNTIME_DIR=/tmp/ffv-runtime weston --backend=headless --renderer=gl --socket=wayland-1 --idle-time=0 --width=1280 --height=720 --log=/tmp/ffv-weston.log >/tmp/ffv-weston.stdout 2>&1 &
          for i in $(seq 1 45); do
            if [ -S /tmp/ffv-runtime/wayland-1 ]; then break; fi
            sleep 1
          done
          test -S /tmp/ffv-runtime/wayland-1
      - name: Launch Minecraft client renderer and camera smoke test
        run: |
          set +e
          XDG_RUNTIME_DIR=/tmp/ffv-runtime WAYLAND_DISPLAY=wayland-1 SDL_VIDEODRIVER=wayland LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe timeout -k 5s 60s gradle :elemental-content:runClient --no-daemon --stacktrace 2>&1 | tee client-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            cat client-smoke.log
            exit "$status"
          fi
          if grep -q "Failed to create backend OpenGL\|Couldn.t find matching GLX visual\|Mixin apply failed" client-smoke.log; then
            cat client-smoke.log
            exit 1
          fi
          grep -q "Final Fantasy V Reborn 1.0.0" client-smoke.log
          grep -q "NeoForge mod loading, version 26.3.0.95" client-smoke.log
      - name: Assemble installable modpack
        run: |
          mkdir -p dist/overrides/mods
          cp elemental-content/build/libs/ffv_reborn-1.0.0.jar dist/overrides/mods/
          cp modpack/manifest.json dist/manifest.json
          cp modpack/README.md dist/README.md
          (cd dist && zip -qr ../Final-Fantasy-V-Reborn-modpack.zip .)
      - name: Upload installable modpack
        uses: actions/upload-artifact@v4
        with:
          name: Final-Fantasy-V-Reborn-modpack
          path: Final-Fantasy-V-Reborn-modpack.zip
          if-no-files-found: error
      - name: Preserve Minecraft logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-neoforge-gametest-logs
          path: |
            **/logs/**
            **/crash-reports/**
            client-smoke.log
          if-no-files-found: warn
